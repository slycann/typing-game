<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4fc3ff" />
    <title>Letterlings – a typing adventure for kids</title>
    <meta name="description" content="A colourful, story-driven typing game that teaches kids aged 5 to 10 to use a real keyboard. No ads, no accounts; progress stays on your device." />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      @font-face {
        font-family: 'Andika';
        src: url('./assets/fonts/andika-400.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: 'Andika';
        src: url('./assets/fonts/andika-700.woff2') format('woff2');
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: 'Fredoka';
        src: url('./assets/fonts/fredoka-600.woff2') format('woff2');
        font-weight: 400 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(#4fc3ff, #b8ecff 60%, #7ed957 60%);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      /* Keep fonts warm so Phaser can draw with them right away */
      .font-warm {
        position: absolute;
        left: -9999px;
        font-family: 'Andika', 'Fredoka';
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <span class="font-warm">a<b>a</b><span style="font-family: Fredoka">a</span></span>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
